<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}

#scene-container{position:fixed;inset:0}

/* ── Loading screen ── */
#loading{
  position:fixed;inset:0;z-index:100;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s cubic-bezier(0.22,1,0.36,1);
}
#loading.done{opacity:0;pointer-events:none}
#loading .wordmark{
  font-family:'Carattere',cursive;
  font-size:clamp(2.8rem,6vw,4.5rem);
  color:#B87333;
  letter-spacing:.08em;
  opacity:0;
  animation:fadeIn .8s .2s ease forwards;
}
#loading .load-sub{
  font-family:'Jost',sans-serif;font-weight:200;
  font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
  margin-top:14px;
  opacity:0;
  animation:fadeIn .5s .8s ease forwards;
}
#loading .dots{
  margin-top:10px;display:flex;gap:5px;
  opacity:0;
  animation:fadeIn .5s 1s ease forwards;
}
#loading .dots span{
  width:4px;height:4px;border-radius:50%;
  background:rgba(184,115,51,.5);
  animation:pulse 1.2s ease-in-out infinite;
}
#loading .dots span:nth-child(2){animation-delay:.2s}
#loading .dots span:nth-child(3){animation-delay:.4s}
@keyframes fadeIn{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

/* ── UI overlay ── */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}

/* ── Top-left brand ── */
.brand{position:absolute;top:24px;left:28px}
.brand-name{
  font-family:'Carattere',cursive;
  font-size:32px;color:#B87333;
  letter-spacing:.05em;line-height:1;
}
.brand-sub{
  font-family:'Jost',sans-serif;font-weight:200;
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.7);
  margin-top:5px;
}

/* ── Top-right CTA ── */
.cta{position:absolute;top:24px;right:28px;pointer-events:auto}
.cta a{
  display:inline-block;
  border:1px solid #B87333;background:transparent;color:#B87333;
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  text-decoration:none;padding:14px 24px;
  transition:background .2s ease,color .2s ease;
}
.cta a:hover{background:#B87333;color:#fff}
.cta a:active{background:#9B612A;color:#fff}

/* ── Bottom-left hint ── */
.hint{
  position:absolute;bottom:28px;left:28px;
  font-family:'Jost',sans-serif;font-weight:200;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);
}

/* ── Bottom-right camera buttons ── */
.cam-btns{
  position:absolute;bottom:28px;right:28px;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:auto;
}
.cam-btns button{
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.5);
  font-family:'Jost',sans-serif;
  font-weight:300;font-size:.72rem;
  letter-spacing:.1em;text-transform:uppercase;
  padding:9px 18px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:border-color .3s ease,color .3s ease;
}
.cam-btns button:hover{border-color:#B87333;color:#B87333}
.cam-btns button:active{color:#d4944a}

/* ── Responsive ── */
@media(max-width:768px){
  .brand{top:14px;left:16px}
  .brand-name{font-size:24px}
  .brand-sub{font-size:9px;letter-spacing:.12em}
  .cta{top:14px;right:16px}
  .cta a{padding:10px 16px;font-size:10px;letter-spacing:.15em}
  .hint{display:none}
  .cam-btns{
    bottom:16px;left:16px;right:16px;
    flex-direction:row;gap:6px;
  }
  .cam-btns button{flex:1;padding:10px 6px;font-size:.6rem;text-align:center}
}
</style>
</head>

  </div>
</div>
