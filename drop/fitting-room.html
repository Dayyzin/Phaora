<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Fitting Room</title>
<script>
/* arriving from the film's end: the page opens on the film's own last frame, then the room comes alive under it */
if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add("embed");
if (location.hash === "#from-film"){ document.documentElement.classList.add("from-film", "holding"); history.replaceState(null, "", location.pathname + location.search); }
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* The film's last frame as the room; the controls as dark glass with the electric blue, from David's picker reference. */
:root{
  --room:#C6C0B2;
  --ui-bg:rgba(8,13,20,.62); --ui-bg2:rgba(8,13,20,.84);
  --ui-line:rgba(221,238,244,.42); --ui-line-soft:rgba(221,238,244,.16);
  --blue:#DDEEF4; --blue-2:#DDEEF4; --ui-text:#EEF4F7; --ui-dim:#A9BAC5;
  --glow:0 0 14px rgba(221,238,244,.26);
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Manrope", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--room); font-family:var(--sans); overflow:hidden;}
#stage{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
#stage.dragging{cursor:grabbing;}
#endframe{display:none;}
.from-film #endframe{display:block; position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:7; pointer-events:none; background:#000; transition:opacity 1.4s ease;}
@media (min-aspect-ratio: 3/4){ .from-film #endframe{object-fit:contain;} }
.from-film #endframe.gone{opacity:0;}
.holding, .holding body{background:#000;}
/* inside the website's page: no way out to draw (the page goes on), no film thumbnail; a vertical swipe
   scrolls the page, a sideways drag turns him */
.embed #exitbtn, .embed #filmbtn, .embed .film{display:none !important;}
/* inside the page the page's own mark is always showing at the top; the room does not repeat it */
.embed .brandline{display:none !important;}
.embed #stage{touch-action:pan-y;}
.rail, .views, .film{transition:opacity .8s ease;}
.holding .rail, .holding .views, .holding .film, .holding .spot{opacity:0; pointer-events:none;}
button{font-family:var(--sans);}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue-2); outline-offset:2px;}

/* ---- top bar ---- */
.topbar{position:fixed; z-index:10; top:calc(12px + env(safe-area-inset-top,0px));
  left:max(14px, env(safe-area-inset-left,0px)); right:max(14px, env(safe-area-inset-right,0px));
  display:flex; align-items:center; justify-content:space-between; pointer-events:none;}
.topbar > *{pointer-events:auto;}
.gbtn{width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
  background:var(--ui-bg); border:1px solid var(--ui-line-soft); color:var(--ui-text);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); cursor:pointer; transition:border-color .2s, box-shadow .2s;}
.gbtn:hover{border-color:var(--ui-line);}
.gbtn[aria-pressed="true"]{border-color:var(--blue); box-shadow:var(--glow);}
.gbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round;}
.gbtn .ic{font-family:var(--serif); font-weight:600; font-size:12px; letter-spacing:.04em; color:#EEF4F7;}
.brandline{position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; pointer-events:none;}
.brandline img{height:30px; width:auto; filter:drop-shadow(0 0 10px rgba(201,205,207,.5));}
.brandline img.word{height:17px; filter:drop-shadow(0 1px 10px rgba(10,14,26,.7));}
.brandline span{font-family:var(--serif); font-weight:600; font-size:17px; letter-spacing:.32em; text-indent:.32em; color:#F2F4F8; text-shadow:0 1px 14px rgba(10,14,26,.7);}
.toast{position:fixed; z-index:9; top:calc(76px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
  background:var(--ui-bg); border:1px solid var(--ui-line-soft); border-radius:999px; padding:7px 14px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ui-dim);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); white-space:nowrap;}
.toast:empty{display:none;}

/* ---- left rail ---- */
.rail{position:fixed; z-index:10; left:max(14px, env(safe-area-inset-left,0px)); top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; gap:16px;}
.railitem{display:grid; justify-items:center; gap:7px;}
.railitem span{font-family:var(--serif); font-weight:600; font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#EEF4F7; text-shadow:0 1px 3px rgba(3,8,13,.9), 0 0 10px rgba(3,8,13,.6); text-indent:.26em;}

/* ---- hotspots ---- */
.spot{position:fixed; z-index:8; transform:translate(-50%,-50%); transition:opacity .2s;}
.spot[hidden]{display:none;}
.spot button{width:26px; height:26px; border-radius:50%; border:1px solid rgba(221,238,244,.85); cursor:pointer;
  background:rgba(8,13,20,.6); color:#EEF4F7; font-size:15px; line-height:1; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 0 3px rgba(221,238,244,.12); display:grid; place-items:center; padding:0;}

/* ---- product card ---- */
.pcard{position:fixed; z-index:12; right:max(16px, env(safe-area-inset-right,0px)); top:calc(84px + env(safe-area-inset-top,0px));
  width:300px; background:var(--ui-bg2); border:1px solid var(--ui-line); border-radius:18px; padding:16px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:var(--glow), 0 18px 50px rgba(5,8,18,.5);
  display:grid; grid-template-columns:72px 1fr; gap:8px 12px; color:var(--ui-text);}
.pcard[hidden]{display:none;}
.pthumbbox{grid-row:1 / span 2; width:72px; height:72px; border-radius:12px; background:rgba(255,255,255,.07);
  border:1px solid var(--ui-line-soft); display:grid; place-items:center; overflow:hidden;}
.pthumbbox img{max-width:100%; max-height:100%; display:block;}
.pname{font-size:13px; letter-spacing:.22em; text-transform:uppercase; align-self:end; padding-right:26px;}
.psub{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--ui-dim); align-self:start; line-height:1.6;}
.pbtns{grid-column:1 / -1; display:grid; gap:9px; margin-top:6px;}
.pbtn{display:flex; align-items:center; justify-content:center; gap:9px; border-radius:999px; padding:13px 16px;
  font-size:11px; letter-spacing:.24em; text-transform:uppercase; text-decoration:none; cursor:pointer; border:1px solid transparent;}
.pbtn.fill{background:#DDEEF4; color:#03080D;}
.pbtn.line{background:transparent; border-color:var(--ui-line); color:var(--ui-text);}
.pclose{position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; border:0; background:transparent; color:var(--ui-dim); cursor:pointer; font-size:15px;}

/* ---- wardrobe drawer: David's picker reference, smaller ---- */
.drawer{position:fixed; z-index:13; right:max(16px, env(safe-area-inset-right,0px)); top:calc(84px + env(safe-area-inset-top,0px));
  width:300px; max-height:calc(100% - 180px); overflow:auto; scrollbar-width:none;
  background:var(--ui-bg2); border:1px solid var(--ui-line-soft); border-radius:16px; padding:13px 14px 12px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 14px 40px rgba(3,8,13,.45);
  display:flex; flex-direction:column; gap:8px; color:var(--ui-text);}
.drawer::-webkit-scrollbar{display:none;}
.drawer[hidden]{display:none;}
.dhead{display:flex; align-items:center; justify-content:space-between;}
.dhead span{font-family:var(--serif); font-weight:500; font-size:14px; letter-spacing:.34em; text-transform:uppercase;}
.dhead button{width:30px; height:30px; border-radius:50%; border:0; background:transparent; color:var(--ui-dim); cursor:pointer; font-size:14px;}
.grouplabel{font-family:var(--serif); font-weight:500; font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--ui-dim); margin:2px 0 -2px;}
.row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.tog{font-family:var(--serif); font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; border:1px solid var(--ui-line-soft);
  background:transparent; color:var(--ui-text); border-radius:999px; padding:6px 11px 5px; cursor:pointer; transition:border-color .18s, box-shadow .18s;}
.tog:hover{border-color:var(--ui-line);}
.tog[aria-pressed="true"]{border-color:#DDEEF4; box-shadow:0 0 10px rgba(221,238,244,.3), inset 0 0 6px rgba(221,238,244,.12);}
.cw{width:24px; height:24px; padding:0; border-radius:50%; border:1px solid var(--ui-line-soft); cursor:pointer;}
.cw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ui-bg2), 0 0 0 3px #DDEEF4, 0 0 10px rgba(221,238,244,.3); border-color:transparent;}
.cw[disabled]{opacity:.25; cursor:default;}
.ornament{display:flex; align-items:center; gap:8px; color:#DDEEF4; margin-top:2px; font-size:9px;}
.ornament::before, .ornament::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--ui-line), transparent);}
.hint{font-size:10px; letter-spacing:.02em; color:var(--ui-dim); line-height:1.6;}
.hint a{color:var(--blue-2);}

/* ---- view segments ---- */
.views{position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; background:var(--ui-bg); border:1px solid var(--ui-line-soft); border-radius:999px; padding:2px 6px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.views button{border:0; background:transparent; color:var(--ui-dim); font-family:var(--serif); font-weight:500; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  padding:9px 14px 8px; cursor:pointer; transition:color .2s, text-shadow .2s;}
.views button + button{border-left:1px solid var(--ui-line-soft);}
.views button[aria-pressed="true"]{color:#EEF4F7; text-shadow:0 0 10px rgba(221,238,244,.55);}

/* ---- film compare ---- */
.film{position:fixed; z-index:9; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:80px; border:1px solid var(--ui-line-soft); border-radius:10px; overflow:hidden; background:#05070D; margin:0;}
.film img{display:block; width:100%;}
.film figcaption{font-family:var(--mono); font-size:8px; letter-spacing:.1em; color:var(--ui-dim); background:#0A0F1D; padding:4px 7px; text-transform:uppercase;}
.film[hidden]{display:none;}

#nogl{position:fixed; inset:0; display:grid; place-items:center; background:var(--room); padding:24px; text-align:center; z-index:30;}
#nogl[hidden]{display:none;}
#nogl img{max-width:min(320px, 80vw); border:1px solid rgba(44,40,33,.2);}
#nogl p{max-width:40ch; color:#55503F; font-size:13px; line-height:1.7;}
#nogl a{color:#262420;}

@media(max-width:759px){
  .gbtn{width:42px; height:42px;}
  .brandline img{height:24px;}
  .brandline img.word{height:17px; filter:drop-shadow(0 1px 10px rgba(10,14,26,.7));}
.brandline span{font-size:14px;}
  .pcard, .drawer{left:max(14px, env(safe-area-inset-left,0px)); right:max(14px, env(safe-area-inset-right,0px)); width:auto; top:auto; bottom:calc(66px + env(safe-area-inset-bottom,0px)); max-height:46%;}
  .drawer{left:auto; width:min(320px, calc(100% - 28px));}
  .film{bottom:auto; top:calc(84px + env(safe-area-inset-top,0px));}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="stage" aria-label="The fitting room — drag to turn the form"></canvas>
<img id="endframe" src="assets/endframe.webp" alt="">

<div class="topbar">
  <a class="gbtn" id="exitbtn" href="/" aria-label="Back to the hall"><svg viewBox="0 0 20 20"><path d="M4 4 L16 16 M16 4 L4 16"/></svg></a>
  <div class="brandline"><img src="assets/crest-small.webp" alt=""><img class="word" src="assets/wordmark.svg" alt="PHAÖRA"></div>
  <button class="gbtn" id="filmbtn" aria-pressed="true" aria-label="Compare with the film frame"><svg viewBox="0 0 20 20"><rect x="4" y="2.5" width="12" height="15" rx="1.5"/><path d="M4 6.5 H16 M4 13.5 H16"/></svg></button>
</div>
<div class="toast" id="status">dressing the form…</div>

<div class="rail">
  <div class="railitem"><button class="gbtn" id="clothesbtn" aria-pressed="false" aria-label="Clothes"><svg viewBox="0 0 20 20"><path d="M10 3.5 a1.8 1.8 0 1 1 1.8 1.8 L10 6.5 L3 12.5 a.8.8 0 0 0 .5 1.4 h13 a.8.8 0 0 0 .5-1.4 L10 6.5"/></svg></button><span>Clothes</span></div>
  <div class="railitem"><button class="gbtn" id="rotatebtn" aria-pressed="true" aria-label="Turntable"><span class="ic">360°</span></button><span>Rotate</span></div>
  <div class="railitem"><button class="gbtn" id="zoombtn" aria-label="Zoom"><svg viewBox="0 0 20 20"><path d="M10 2.5 V17.5 M10 2.5 L7 5.5 M10 2.5 L13 5.5 M10 17.5 L7 14.5 M10 17.5 L13 14.5"/></svg></button><span>Zoom</span></div>
</div>

<div class="spot" id="spot-extra" hidden><button aria-label="The piece on his head">+</button></div>
<div class="spot" id="spot-top" hidden><button aria-label="The top">+</button></div>
<div class="spot" id="spot-bottom" hidden><button aria-label="The bottom">+</button></div>

<aside class="pcard" id="pcard" hidden>
  <button class="pclose" id="pclosebtn" aria-label="Close">✕</button>
  <div class="pthumbbox"><img id="pthumb" alt=""></div>
  <div class="pname" id="pname"></div>
  <div class="psub" id="psub"></div>
  <div class="pbtns">
    <a class="pbtn fill" href="index.html#register" target="_top">Join the register</a>
    <button class="pbtn line" id="pchange">Change the piece</button>
  </div>
</aside>

<aside class="drawer" id="drawer" hidden>
  <div class="dhead"><span>Clothes</span><button id="dclose" aria-label="Close">✕</button></div>
  <div class="grouplabel">Top</div>
  <div class="row" role="group" aria-label="Top">
    <button class="tog" data-top="jq_serpent_emblem" aria-pressed="true">Serpent Emblem</button>
    <button class="tog" data-top="tee_serpent_emblem" aria-pressed="false">Emblem Tee</button>
    <button class="tog" data-top="drop2_tee" aria-pressed="false">Drop 2 Tee</button>
    <button class="tog" data-top="drop2_crew" aria-pressed="false">Drop 2 Crewneck</button>
    <button class="tog" data-top="jq_serpent_damask" aria-pressed="false">Damask</button>
    <button class="tog" data-top="jq_garden_parterre" aria-pressed="false">Parterre</button>
    <button class="tog" data-top="jq_star_lattice" aria-pressed="false">Star Lattice</button>
    <button class="tog" data-top="jq_damask_blocking" aria-pressed="false">Blocking</button>
    <button class="tog" data-top="jq_hem_cuff_band" aria-pressed="false">Hem Band</button>
    <button class="tog" data-top="jq_star_fade" aria-pressed="false">Star Fade</button>
    <button class="tog" data-top="" aria-pressed="false">None</button>
  </div>
  <div class="grouplabel" id="colourlabel">Colour</div>
  <div class="row" role="group" aria-label="Colourway">
    <button class="cw" data-colour="navy" aria-pressed="true" title="Navy" style="background:#05070d;"></button>
    <button class="cw" data-colour="black" aria-pressed="false" title="Black" style="background:#171718;"></button>
    <button class="cw" data-colour="blue" aria-pressed="false" title="Blue" style="background:#5d7cc4;"></button>
    <button class="cw" data-colour="white" aria-pressed="false" title="White" style="background:#f3f3f0;"></button>
    <button class="cw" data-colour="pink" aria-pressed="false" title="Pink" style="background:#cf6490;"></button>
    <button class="cw" data-colour="purple" aria-pressed="false" title="Purple" style="background:#8a6cc9;"></button>
  </div>
  <div class="grouplabel">Bottom · extras</div>
  <div class="row" role="group" aria-label="Bottom and extras">
    <button class="tog" data-bottom="ivy_shorts_navy" aria-pressed="true">Ivy shorts, navy</button>
    <button class="tog" data-bottom="ivy_shorts" aria-pressed="false">Ivy shorts</button>
    <button class="tog" data-bottom="joggers" aria-pressed="false">Joggers</button>
    <button class="tog" data-bottom="" aria-pressed="false">None</button>
    <button class="tog" data-extra="beanie" aria-pressed="false">Beanie</button>
    <button class="tog" data-extra="scarf" aria-pressed="false">Scarf</button>
  </div>
  <div class="ornament" aria-hidden="true">&#10022;</div>
  <div class="hint">Drag to turn. Pinch or scroll to come closer. The Serpent Emblem Hoodie comes in navy.</div>
</aside>

<div class="views" role="group" aria-label="View">
  <button data-view="front" aria-pressed="true">Front</button>
  <button data-view="side" aria-pressed="false">Side</button>
  <button data-view="back" aria-pressed="false">Back</button>
</div>

<figure class="film" id="filmframe">
  <img src="assets/f-p20.webp" alt="The film's fitting-room frame, for comparison">
  <figcaption>film p20</figcaption>
</figure>

<div id="nogl" hidden>
  <div>
    <img src="assets/f-p20.webp" alt="The fitting room, from the film">
    <p>This device declined the 3D room, so here is the frame it matches. <a href="/" target="_top">Back to the hall</a></p>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fromFilm = document.documentElement.classList.contains("from-film");
const EMBED = document.documentElement.classList.contains("embed");
/* in the page: the room comes alive when the page says it is on screen, and rests while it is not */
let shownMsg = !EMBED, restWhileHidden = false;
const canvas = document.getElementById("stage");
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
}catch(e){
  document.getElementById("nogl").hidden = false;
  canvas.remove();
}
if (renderer){
/* a phone can take the 3D away (memory, the app sent to the back). three keeps the room and redraws
   it when the phone gives it back; if that takes more than a few seconds, the film's frame stands in */
{
  const nogl = document.getElementById("nogl"); let wait = 0;
  canvas.addEventListener("webglcontextlost", () => { clearTimeout(wait); wait = setTimeout(() => { nogl.hidden = false; }, 4000); });
  canvas.addEventListener("webglcontextrestored", () => { clearTimeout(wait); nogl.hidden = true; });
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
/* graded as the film is (look.py: AgX, no look). ACES's toe took everything darker than about 0.0015 to
   black, and with it the stitches of the dark knits (David: "looks so black doesn't even look like there's
   knitting texture"). At 2.0 the walls are the film's last frame's, measured: #9F9A91 against #9E9990 */
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 2.0;
renderer.localClippingEnabled = true;   /* the bottoms stop at a hoodie's hem (clipBottoms) */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8E8981);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);

/* ---------- canvas textures ---------- */
function tex(c, srgb=true){ const t = new THREE.CanvasTexture(c); if(srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }

/* plaster wall with embossed ivy, low contrast */
function wallTile(){
  const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
  x.fillStyle = "#ABA69D"; x.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){ x.fillStyle = Math.random()<.5?"rgba(96,89,76,.05)":"rgba(252,249,240,.06)"; x.fillRect(Math.random()*512,Math.random()*512,1.3,1.3); }
  function curl(){
    const sx=Math.random()*512, sy=Math.random()*512, r=18+Math.random()*40, a0=Math.random()*6.3, dir=Math.random()<.5?1:-1;
    const path=()=>{ x.beginPath(); x.arc(sx,sy,r,a0,a0+3.6*dir,dir<0); x.arc(sx+Math.cos(a0)*r*.4, sy+Math.sin(a0)*r*.4, r*.45, a0+3.6*dir, a0+6.4*dir, dir<0); x.stroke(); };
    x.strokeStyle="rgba(92,85,72,.11)"; x.lineWidth=2; x.save(); x.translate(1.2,1.4); path(); x.restore();
    x.strokeStyle="rgba(252,249,240,.26)"; x.lineWidth=1.2; x.save(); x.translate(-.7,-.8); path(); x.restore();
  }
  for(let i=0;i<12;i++) curl();
  for(let i=0;i<9;i++){ const px=Math.random()*512, py=Math.random()*512;
    for(let p=0;p<5;p++){ const a=p/5*Math.PI*2; x.strokeStyle="rgba(92,85,72,.09)"; x.lineWidth=1.3; x.beginPath(); x.ellipse(px+Math.cos(a)*6, py+Math.sin(a)*6, 3.4, 2, a, 0, Math.PI*2); x.stroke(); } }
  return c;
}

/* environment — dark studio with vertical light bars, for the gloss */
function envTexture(){

function loadTex(url){

    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; res(t);
  }, undefined, () => res(null))));

}
function setMap(m, url){
  if (!m || m.userData.url === url) return Promise.resolve();
  m.userData.url = url;
  return loadTex(url).then(t => {
    if (!t || m.userData.url !== url) return;
    const old = m.map;
    if (old){ t.wrapS = old.wrapS; t.wrapT = old.wrapT; t.offset.copy(old.offset); t.repeat.copy(old.repeat); t.rotation = old.rotation; t.channel = old.channel; }

const HEMCLIP = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
/* the lowest point of a top's hem rib, in the room */
function hemOf(root){
  if (root.userData.hem !== undefined) return root.userData.hem;
  /* its parents too: inside the page the room loads unseen, before it has drawn once, and without them the
     figure's lift onto the dais was missing, so the cut came 7 cm low (David: "He got his shorts pulled down") */
  root.updateWorldMatrix(true, true);
  let lo = Infinity; const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || ![].concat(o.material).some(m => ["band","hem_rib"].includes(baseName(m.name)))) return;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++){ v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld); if (v.y < lo) lo = v.y; }
  });
  return (root.userData.hem = isFinite(lo) ? lo : null);
}
/* the bottoms drawn only below `y` (null: whole) */
function clipBottoms(y){
  const R = slotRoots.bottom; if (!R) return;
  if (y !== null) HEMCLIP.constant = y + 0.004;
  R.traverse(o => { if (!o.isMesh) return;
    for (const m of [].concat(o.material)){
      const on = y !== null, was = !!(m.clippingPlanes && m.clippingPlanes.length);
      if (on !== was){ m.clippingPlanes = on ? [HEMCLIP] : null; m.needsUpdate = true; }
    } });
}

async function setSlot(slot, file){
  const my = ++want[slot];
  if (slotRoots[slot]){ FIG.remove(slotRoots[slot]); slotRoots[slot] = null; }
  if (!file){ if (!loadsLive) note(""); dress(); return; }
  loadsLive++; note("Loading…");
  try{
    const scn = await loadModel(file);
    if (want[slot] !== my) return;
    if (slot === "base"){
      const h = new THREE.Box3().setFromObject(scn).getSize(new THREE.Vector3()).y;
      if (h > 2.4 || h < 1.2) FIG.scale.setScalar(1.82/h);
    }
    slotRoots[slot] = scn; FIG.add(scn); dress();
  }catch(e){
    /* the base carries his socks and shoes, under the film's figure too, and nothing in the drawer loads it
       again: one more try before giving up (without it he stood barefoot) */
    if (want[slot] === my && slot === "base" && !setSlot.again){ setSlot.again = true; setTimeout(() => setSlot("base", file), 1500); return; }
    if (want[slot] === my) note("A piece didn't load — tap it again.");
    return;
  }finally{
    loadsLive = Math.max(0, loadsLive-1);
    if (!loadsLive) note("");
  }
}

    const knit = new THREE.Mesh(geo, m); knit.position.set(0, -.025, -.02); hung.add(knit);
    const hook = new THREE.Mesh(new THREE.TorusGeometry(.028, .004, 8, 24, Math.PI * 1.4), chromeM);
    hook.rotation.z = -Math.PI * .2; hook.position.y = .028; hung.add(hook);
    const shoulders = new THREE.Mesh(rod(.46, .005), chromeM); shoulders.rotation.z = Math.PI/2; shoulders.position.y = -.07; hung.add(shoulders);
    hung.scale.setScalar(.9); hung.rotation.y = -Math.PI/2; hung.position.set(-.012, 1.72, (i - .5) * .72);
    hung.userData.tap = () => wearFromRail(id, cw);
    rail.add(hung); eggs.push(hung);
  });
}
function wearFromRail(id, cw){
  const b = document.querySelector(`.tog[data-top="${id}"]`); if (!b) return;
  outfit.topColour = colourPick = cw;
  b.click();
}

/* a small silver serpent on top of the mirror's frame; egg: it slips along to the other end */
const SN = 40, snakeCurve = new THREE.CatmullRomCurve3(Array.from({ length: 8 }, () => new THREE.Vector3()));
const snake = new THREE.Mesh(new THREE.BufferGeometry(), silverM); decor.add(snake);
const snakeHead = new THREE.Mesh(new THREE.SphereGeometry(.011, 16, 10), silverM); snakeHead.scale.set(1.5, .8, 1); decor.add(snakeHead);
const snakeHit = new THREE.Mesh(new THREE.BoxGeometry(.5, .12, .1), new THREE.MeshBasicMaterial({ visible: false }));
let snakeX = .18, snakeGo = 0, snakePhase = 0;
const FRAME_TOP = 2.24 + .005 + .03;
function laySnake(){
  const pts = snakeCurve.points;
  for (let i = 0; i < pts.length; i++){
    const t = i / (pts.length - 1);
    pts[i].set(snakeX - .14 + t * .28, FRAME_TOP + .006, -D/2 + .05 + Math.sin(t * 9 + snakePhase) * .012 * (1 - t * .5));
  }
  snake.geometry.dispose();
  snake.geometry = new THREE.TubeGeometry(snakeCurve, SN, .006, 8, false);
  const end = pts[pts.length - 1], prev = pts[pts.length - 2];
  snakeHead.position.copy(end); snakeHead.rotation.y = -Math.atan2(end.z - prev.z, end.x - prev.x);
  snakeHit.position.set(snakeX, FRAME_TOP + .03, -D/2 + .06);
}
laySnake(); decor.add(snakeHit);
snakeHit.userData.tap = () => { if (!snakeGo) snakeGo = snakeX > 0 ? -1 : 1; };
eggs.push(snakeHit);

/* each frame: the glint's run, the lid, the serpent */
function decorTick(dt){
  if (glintT >= 0){
    glintT += dt; const k = Math.min(1, glintT / 1.4);
    glint.position.x = glintX - .45 + .9 * k; glint.intensity = 7 * Math.sin(Math.PI * k);
    if (k >= 1){ glintT = -1; glint.intensity = 0; }
  }
  if (lidT >= 0){
    lidT += dt;
    const open = lidT < .7 ? lidT / .7 : lidT < 3.2 ? 1 : Math.max(0, 1 - (lidT - 3.2) / .7);
    lid.rotation.x = -1.15 * (open * open * (3 - 2 * open));
    if (lidT > 3.9){ lidT = -1; lid.rotation.x = 0; }
  }
  if (snakeGo){
    snakeX += snakeGo * dt * .16; snakePhase += dt * 9;
    if ((snakeGo < 0 && snakeX <= -.18) || (snakeGo > 0 && snakeX >= .18)){ snakeX = snakeGo < 0 ? -.18 : .18; snakeGo = 0; }
    laySnake();
  }
}

/* a tap, not a drag, finds an egg: the nearest thing under it, so he hides what is behind him */
const tapRay = new THREE.Raycaster(), tapDown = { x: 0, y: 0, t: 0 };
canvas.addEventListener("pointerdown", e => { tapDown.x = e.clientX; tapDown.y = e.clientY; tapDown.t = performance.now(); });
canvas.addEventListener("pointerup", e => {
  if (Math.hypot(e.clientX - tapDown.x, e.clientY - tapDown.y) > 6 || performance.now() - tapDown.t > 450) return;
  const r = canvas.getBoundingClientRect();
  tapRay.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = tapRay.intersectObjects([...eggs, FIG], true)[0];
  let o = hit && hit.object; while (o && !o.userData.tap) o = o.parent;
  if (o) o.userData.tap();
});
/* on a desktop, the hand over anything that answers */
let hoverAt = 0;
canvas.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || pointers.size || performance.now() - hoverAt < 120) return;
  hoverAt = performance.now();
  const r = canvas.getBoundingClientRect();
  tapRay.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  canvas.style.cursor = tapRay.intersectObjects(eggs, true).length ? "pointer" : "";
});

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xF1F0EC, 0x6E6A63, 1.05));
scene.add(new THREE.AmbientLight(0xffffff, .12));
const key = new THREE.DirectionalLight(0xF4F3F0, .85); key.position.set(1.6,3,2.6); scene.add(key);

/* ---------- camera orbit ---------- */
const target = new THREE.Vector3(0, 1.0, 0);
let yaw = 0, pitch = .05, radius = 2.8;
let targetYaw = null, targetRadius = 2.8;
/* David, 7 Nov: "Bring back infinite zoom": pinch, scroll and the zoom button come in to 0.45 m off his middle
   (was 1.9 m), toward the point under the fingers or the pointer */
const PITCH = [-.03,.55], RAD = [0.45, 2.9];
let intro = (reduced || fromFilm) ? 1 : 0;
/* from the film: the film's own camera, solved from its last frame (the floor line at half height,
   his feet at 0.835 and his hood's top at 0.155 of it): 1.9 m up, 2.6 m back, 18 degrees down */
if (fromFilm){ target.y = 1.018; pitch = .3202; radius = targetRadius = 2.9; }
const BASE_Y = target.y;
/* to radius r, keeping the height under (cx, cy) where it is on screen; all the way out, back to his middle */
const zoomRay = new THREE.Raycaster(), zoomNdc = new THREE.Vector2();
function zoomTo(r, cx, cy){
  const r0 = targetRadius; targetRadius = r = Math.min(RAD[1], Math.max(RAD[0], r));
  if (cx === undefined) return;
  let y = BASE_Y;
  if (r < RAD[1] - 1e-3){
    const b = canvas.getBoundingClientRect();
    zoomNdc.set((cx - b.left) / b.width * 2 - 1, -((cy - b.top) / b.height) * 2 + 1);
    zoomRay.setFromCamera(zoomNdc, camera);
    const n = new THREE.Vector3(camera.position.x - target.x, 0, camera.position.z - target.z).normalize();
    const hit = zoomRay.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(n, target), new THREE.Vector3());
    if (!hit) return;
    const ty = lens.ay ?? target.y;
    y = ty + (hit.y - ty) * (1 - r / r0);
  }
  lens.ay = Math.min(1.8, Math.max(0.2, y));
}
let autoSpin = !reduced && !fromFilm;
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function place(){
  const iy = reduced ? 0 : (1-ease(intro));
  const p = pitch + iy*.42, r = radius + iy*.5;
  camera.position.set(
    target.x + r*Math.sin(yaw)*Math.cos(p),
    target.y + r*Math.sin(p),
    target.z + r*Math.cos(yaw)*Math.cos(p));
  camera.lookAt(target);
}

const rotateBtn = document.getElementById("rotatebtn");
function stopSpin(){ autoSpin = false; rotateBtn.setAttribute("aria-pressed","false"); }
const pointers = new Map();
let lastPinch = 0;
canvas.addEventListener("pointerdown", e=>{ canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,[e.clientX,e.clientY]); canvas.classList.add("dragging"); stopSpin(); targetYaw = null; clearViews(); });
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size === 1){
    yaw -= (e.clientX-prev[0])*.0052;
    pitch = Math.min(PITCH[1], Math.max(PITCH[0], pitch + (e.clientY-prev[1])*.004));
  } else if(pointers.size === 2){
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0][0]-pts[1][0], pts[0][1]-pts[1][1]);
    if(lastPinch){ zoomTo(targetRadius * (lastPinch/d), (pts[0][0]+pts[1][0])/2, (pts[0][1]+pts[1][1])/2); radius = targetRadius; }
    lastPinch = d;
  }
});
const lift = e=>{ pointers.delete(e.pointerId); lastPinch = 0; canvas.classList.remove("dragging"); };
canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);
canvas.addEventListener("wheel", e=>{ if (EMBED && !e.ctrlKey) return; e.preventDefault(); stopSpin(); zoomTo(targetRadius*(1+e.deltaY*.0011), e.clientX, e.clientY); }, {passive:false});

/* ---------- the new chrome: drawer, card, spots, views, rail ---------- */
const drawer = document.getElementById("drawer"), pcard = document.getElementById("pcard");
const clothesBtn = document.getElementById("clothesbtn");
function openDrawer(){ pcard.hidden = true; drawer.hidden = false; clothesBtn.setAttribute("aria-pressed","true"); frameDrawer(true); }
function closeDrawer(){ drawer.hidden = true; clothesBtn.setAttribute("aria-pressed","false"); frameDrawer(false); }
/* David: "find a way to not block the shorts for when picking different types". While the drawer is open
   he is drawn in the part of the screen it leaves free: the lens shifts there (setViewOffset), and that part
   sees what the whole screen saw. Where the drawer is a sheet over the lower half (a phone), the camera also
   frames there what was picked last: a bottom his hips and legs, a top his chest, a hat or scarf his head,
   and all of him as the drawer opens. Closed, it goes back to where it was */
const FRAMES = { all:[.95, 1.9], top:[1.3, 1.1], bottom:[.62, 1.15], extra:[1.62, .7] };   /* centre height, span (m) */
let fov0 = 42, home = null;
const lens = { x:0, y:0, f:1, tx:0, ty:0, tf:1, ay:null };
function freeArea(){
  if (drawer.hidden) return null;
  const r = drawer.getBoundingClientRect(), w = innerWidth, h = innerHeight;
  if (r.top > h * .3){                       /* a sheet: the space above it, under the status line */
    const st = statusEl.getBoundingClientRect(), y0 = st.height ? Math.min(h * .2, st.bottom + 6) : 0;
    return { x0:0, y0, x1:w, y1:Math.max(y0 + h * .2, r.top - 12), sheet:true };
  }
  return { x0:0, y0:0, x1:Math.max(w * .4, r.left - 8), y1:h, sheet:false };   /* a panel: the space beside it */
}
function aimLens(){
  const f = freeArea(), w = innerWidth, h = innerHeight;
  if (!f){ lens.tx = lens.ty = 0; lens.tf = 1; return null; }
  lens.tx = w/2 - (f.x0 + f.x1)/2; lens.ty = h/2 - (f.y0 + f.y1)/2; lens.tf = (f.y1 - f.y0) / h;
  return f;
}
function framePick(kind){
  const f = aimLens();
  if (!f || !f.sheet) return;
  if (!home) home = { y: lens.ay ?? target.y, r: targetRadius };
  lens.ay = FRAMES[kind][0];
  targetRadius = Math.min(2.9, Math.max(1.5, 1.2 * FRAMES[kind][1] / (2 * Math.tan(fov0 * Math.PI / 360))));
}
function frameDrawer(open){
  if (open){ framePick("all"); return; }
  aimLens();
  if (home){ lens.ay = home.y; targetRadius = home.r; home = null; }
}
/* each frame, eased: the lens toward its shift, the aim toward the framed height */
function applyLens(dt){
  const k = Math.min(1, dt * 6), w = innerWidth, h = innerHeight;
  lens.x += (lens.tx - lens.x) * k; lens.y += (lens.ty - lens.y) * k; lens.f += (lens.tf - lens.f) * k;
  if (lens.ay !== null){
    target.y += (lens.ay - target.y) * k;
    if (Math.abs(lens.ay - target.y) < 1e-4){ target.y = lens.ay; if (!home) lens.ay = null; }
  }
  if (Math.abs(lens.x) < .5 && Math.abs(lens.y) < .5 && Math.abs(lens.f - 1) < .001){
    if (camera.view && camera.view.enabled){ camera.clearViewOffset(); camera.aspect = w/h; camera.fov = fov0; camera.updateProjectionMatrix(); }
    return;
  }
  const fw = w + 2*Math.abs(lens.x), fh = h + 2*Math.abs(lens.y);
  camera.aspect = fw / fh;
  camera.fov = 2 * Math.atan(Math.tan(fov0 * Math.PI / 360) * fh / (lens.f * h)) * 180 / Math.PI;
  camera.setViewOffset(fw, fh, lens.x > 0 ? 2*lens.x : 0, lens.y > 0 ? 2*lens.y : 0, w, h);
}
clothesBtn.addEventListener("click", ()=> drawer.hidden ? openDrawer() : closeDrawer());
document.getElementById("dclose").addEventListener("click", closeDrawer);
document.getElementById("pclosebtn").addEventListener("click", ()=> pcard.hidden = true);
document.getElementById("pchange").addEventListener("click", ()=>{ pcard.hidden = true; openDrawer(); });

rotateBtn.addEventListener("click", ()=>{
  autoSpin = !autoSpin;
  rotateBtn.setAttribute("aria-pressed", String(autoSpin));
  if (autoSpin){ targetYaw = null; clearViews(); }
});
/* the button: whole figure, closer, then the chest (1.3 m up) close and closer, and round again */
const ZSTEPS = [2.85, 2.45, 2.05, 1.25, 0.7]; let zi = 0;
document.getElementById("zoombtn").addEventListener("click", ()=>{ zi = (zi+1)%ZSTEPS.length; targetRadius = ZSTEPS[zi]; lens.ay = ZSTEPS[zi] < 1.5 ? 1.3 : BASE_Y; });

const viewBtns = [...document.querySelectorAll(".views button")];
const VIEW_YAW = { front:0, side:Math.PI/2, back:Math.PI };
function clearViews(){ viewBtns.forEach(b=>b.setAttribute("aria-pressed","false")); }
viewBtns.forEach(b=> b.addEventListener("click", ()=>{
  clearViews(); b.setAttribute("aria-pressed","true");
  stopSpin();
  const t = VIEW_YAW[b.dataset.view];
  yaw = ((yaw % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  targetYaw = t + (yaw - t > Math.PI ? 2*Math.PI : (t - yaw > Math.PI ? -2*Math.PI : 0));
}));

const filmBtn = document.getElementById("filmbtn"), filmFrame = document.getElementById("filmframe");
filmBtn.addEventListener("click", ()=>{
  const on = filmFrame.hidden; filmFrame.hidden = !on; filmBtn.setAttribute("aria-pressed", String(on));
});

/* hotspots: anchored to the garments, like the reference */
const spots = {
  extra: { el: document.getElementById("spot-extra"), v: new THREE.Vector3(0,1.8,.16) },
  top: { el: document.getElementById("spot-top"), v: new THREE.Vector3(.17,1.26,.2) },
  bottom: { el: document.getElementById("spot-bottom"), v: new THREE.Vector3(.15,.93,.18) },
};
function spotHas(slot){
  if (slot === "top") return !!slotRoots.top;
  if (slot === "bottom") return !!slotRoots.bottom;
  return !!(slotRoots.beanie || slotRoots.scarf);
}
function syncSpots(){
  for (const s of Object.keys(spots)) spots[s].el.hidden = !spotHas(s);
  syncSwatches();
}
/* David: "Still not possible to change shorts/scarf colors". The colour row is for the piece picked last:
   the top, the bottoms, the scarf or the beanie. It offers that piece's colourways and recolours that piece
   alone, and its label names it; with nothing picked yet it is the top's */
let colourFor = "top";
const colourLabel = document.getElementById("colourlabel");
function colourPiece(){
  if (!WARDROBE) return null;
  for (const k of [colourFor, "top", "bottom"]){
    if (k === "top" && outfit.top && WARDROBE.tops[outfit.top]) return { g: WARDROBE.tops[outfit.top], key: "topColour" };
    if (k === "bottom" && outfit.bottom && WARDROBE.shorts[outfit.bottom]) return { g: WARDROBE.shorts[outfit.bottom], key: "bottomColour" };
    if ((k === "scarf" || k === "beanie") && outfit[k]) return { g: WARDROBE.extras[k], key: k + "Colour" };
  }
  return null;
}
function syncSwatches(){
  const p = colourPiece();
  if (p && !p.g.colours[outfit[p.key]]) outfit[p.key] = Object.keys(p.g.colours)[0];
  colourLabel.textContent = p ? "Colour · " + p.g.name : "Colour";
  document.querySelectorAll(".cw[data-colour]").forEach(b => {
    b.disabled = !!(p && !p.g.colours[b.dataset.colour]);
    b.setAttribute("aria-pressed", String(!!p && outfit[p.key] === b.dataset.colour));
  });
}
const THUMB = {
  jq_serpent_emblem: () => "assets/room.webp", ivy_shorts_navy: () => "assets/wear/shorts_navy.webp",
  jq_serpent_damask: () => "assets/v-case-poster.jpg", tee_serpent_emblem: () => "assets/endframe.webp",
  hoodie: c => `assets/wear/hoodie_${c}.webp`, ziphoodie: c => `assets/wear/ziphoodie_${c}.webp`,
  ivy_crew: c => `assets/wear/ivy_crew_${c}.webp`, med_regular: c => `assets/wear/med_regular_${c}.webp`,
  med_boxy: c => `assets/wear/med_boxy_${c}.webp`, ls: c => `assets/wear/ls_${c}.webp`,
  tee: () => "assets/wear/tee_navy.webp",
  ivy_shorts: c => `assets/wear/ivy_shorts_${c}.webp`, shorts: () => "assets/wear/shorts_navy.webp",
  joggers: c => `assets/wear/joggers_${c}.webp`,
  beanie: () => "assets/wear/beanie_navy.webp", scarf: c => `assets/wear/scarf_${c}.webp`,
};
const pthumb = document.getElementById("pthumb"), pname = document.getElementById("pname"), psub = document.getElementById("psub");
pthumb.addEventListener("error", ()=>{ pthumb.style.display = "none"; });
function showCard(slot){
  if (!WARDROBE) return;
  let entry, cw, g;
  if (slot === "top"){ entry = outfit.top; g = WARDROBE.tops[entry]; cw = outfit.topColour; }
  else if (slot === "bottom"){ entry = outfit.bottom; g = WARDROBE.shorts[entry]; cw = outfit.bottomColour; }
  else { entry = slotRoots.beanie ? "beanie" : "scarf"; g = WARDROBE.extras[entry]; cw = g.colours[outfit[entry + "Colour"]] ? outfit[entry + "Colour"] : Object.keys(g.colours)[0]; }
  if (!g) return;
  pname.textContent = g.name;
  psub.textContent = entry === "jq_serpent_emblem" ? "Drop 001 · numbered 1/15 to 15/15 · navy" : cw;
  const t = THUMB[entry]; pthumb.style.display = "block"; pthumb.src = t ? t(cw) : "assets/crest-small.webp";
  closeDrawer(); pcard.hidden = false;
}
for (const s of Object.keys(spots)) spots[s].el.querySelector("button").addEventListener("click", ()=> showCard(s));
const pv = new THREE.Vector3();
function placeSpots(){
  const w = innerWidth, h = innerHeight;
  for (const s of Object.keys(spots)){
    const sp = spots[s]; if (sp.el.hidden) continue;
    pv.copy(sp.v).multiplyScalar(FIG.scale.x).add(FIG.position);
    pv.project(camera);
    if (pv.z > 1){ sp.el.style.opacity = "0"; continue; }
    sp.el.style.opacity = "1";
    sp.el.style.left = ((pv.x*.5+.5)*w) + "px";
    sp.el.style.top = ((-pv.y*.5+.5)*h) + "px";
  }
}

/* ---------- wardrobe buttons ---------- */
const LABELS = {top_hoodie:"the hoodie", top_ziphoodie:"the zip hoodie", top_tee:"the tee", top_med_regular:"the medallion tee", top_med_boxy:"the boxy tee", top_ls:"the long sleeve", top_ivy_crew:"the ivy crew", shorts:"the shorts", bottom_joggers:"the joggers", extra_beanie:"the beanie", extra_scarf:"the scarf"};
const topBtns = [...document.querySelectorAll(".tog[data-top]")];
topBtns.forEach(b => b.addEventListener("click", () => {
  topBtns.forEach(o => o.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");

  outfit.top = entry;

    const g = WARDROBE.tops[entry];

    setSlot("top", g.file);

  }
}));
const botBtns = [...document.querySelectorAll(".tog[data-bottom]")];
botBtns.forEach(b => b.addEventListener("click", () => {
  botBtns.forEach(o => o.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  const entry = b.dataset.bottom;
  framePick("bottom"); colourFor = "bottom";
  if (!entry){ outfit.bottom = ""; setSlot("bottom",""); return; }
  outfit.bottom = entry;
  if (WARDROBE){
    const g = WARDROBE.shorts[entry];
    if (!g.colours[outfit.bottomColour]) outfit.bottomColour = g.colours[colourPick] ? colourPick : Object.keys(g.colours)[0];
    setSlot("bottom", g.file || "shorts");
  }
}));
document.querySelectorAll(".cw[data-colour]").forEach(b => b.addEventListener("click", () => {
  const p = colourPiece();

document.querySelectorAll(".tog[data-extra]").forEach(b => b.addEventListener("click", () => {
  const on = b.getAttribute("aria-pressed") !== "true";

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h;
  camera.fov = (w/h < .75) ? 50 : 42;
  camera.updateProjectionMatrix();
  fov0 = camera.fov; aimLens();
}
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), .05);
  if (restWhileHidden) return;
  if(intro < 1) intro = Math.min(1, intro + dt/2.4);
  if (targetYaw !== null){
    const d = targetYaw - yaw;
    if (Math.abs(d) < .002){ yaw = targetYaw; targetYaw = null; }
    else yaw += d * Math.min(1, dt*5);
  } else if (autoSpin) yaw += dt*.07;
  radius += (targetRadius - radius) * Math.min(1, dt*6);
  applyLens(dt);
  decorTick(dt);
  place();
  placeSpots();
  renderer.render(scene, camera);
});
}
