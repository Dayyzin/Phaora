<div id="intro" aria-hidden="true"><video muted playsinline preload="auto"></video></div>
<script>
(function () {
  // the intro: the house's uplight and its card, once, then the register (painted under it from the start)
  var box = document.getElementById('intro'), v = box.querySelector('video'), done = false;
  var end = function () { if (done) return; done = true; box.classList.add('out'); setTimeout(function () { box.remove(); }, 1300); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) end();
  else requestAnimationFrame(function () { requestAnimationFrame(function () {   // after the first paint (the black cover), so the film never holds the page up
    v.src = innerWidth / innerHeight < 1 ? 'intro-phone.mp4' : 'intro-desk.mp4';
    v.addEventListener('ended', end); v.addEventListener('error', end);
    var p = v.play(); if (p && p.catch) p.catch(end);   // no autoplay (a phone's low power mode): straight to the register
    setTimeout(function () { if (v.paused || v.readyState < 2) end(); }, 4000);   // a slow line: never held behind it
    setTimeout(end, 9000);
  }); });
  // the register: the drop 1 contract (list chapter-1); phaora.com takes the email, anywhere else this is the preview
  var f = document.getElementById('regform'), msg = document.getElementById('regmsg'), btn = document.getElementById('regbtn');
  var live = /(^|\.)phaora\.com$/.test(location.hostname), ref = '';
  try { var r = new URLSearchParams(location.search).get('ref') || ''; if (/^[a-z0-9-]{1,40}$/.test(r)) ref = r; } catch (e) {}
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = f.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "That email didn't take. Try it once more."; f.email.focus(); return; }
    if (!live) { msg.textContent = 'This is the preview. The register takes emails on phaora.com.'; return; }
    btn.disabled = true; msg.textContent = 'Joining\u2026';
    var body = { email: email, list: 'chapter-1', website: f.website.value || '' };
    if (ref) body.ref = ref;
    fetch('https://crm.phaora.com/api/public/waitlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { msg.textContent = "You're on the register."; f.reset(); }
        else { msg.textContent = (j && j.error) || "That email didn't take. Try it once more."; }
      })
      .catch(function () { msg.textContent = "The register didn't answer. Try it once more."; })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
