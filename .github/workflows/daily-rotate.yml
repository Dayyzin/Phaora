name: PHAÖRA Daily Content Rotation

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    name: Rotate Daily Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run rotation script
        run: node scripts/rotate.js

      - name: Commit and push changes
        run: |
          git config user.name "PHAÖRA Automation"
          git config user.email "automation@phaora.com"
          git add \
            the-aerie.html \
            the-ascent.html \
            the-companions.html \
            the-courtship.html \
            the-devotion.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily content rotation [$(date -u '+%Y-%m-%d')]"
            git push
          fi