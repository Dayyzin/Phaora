<!DOCTYPE html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pearl:#EAEFF5;--silver:#DBE6F0;--teal:#4FB5BE;--teal-d:rgba(79,181,190,.55);--gold:#C8A45E;--gold-lt:#D9BC7C;--ink:#020610}
html{background:var(--ink)}
body{background:var(--ink);color:var(--pearl);font-family:'Inter','Helvetica Neue',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}

nav{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,5vw,56px);height:62px;background:rgba(2,6,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(79,181,190,.08)}
nav .lnk{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(234,239,245,.42);transition:color .2s}
nav .lnk:hover{color:var(--pearl)}
.wm{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;color:var(--pearl)}
.wm .o{color:var(--teal-d)}

.stage{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.stage-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;filter:brightness(.62) saturate(.9)}
.stage-veil{position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,6,16,.97) 0%,rgba(2,6,16,.6) 45%,rgba(2,6,16,.72) 100%)}
.stage-body{position:relative;z-index:2;max-width:640px;padding:120px clamp(24px,5vw,56px) 80px;text-align:center;margin:0 auto}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:var(--teal-d)}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(48px,9vw,110px);line-height:1;color:var(--silver);margin-top:20px}
h1 em{font-style:italic;color:var(--gold-lt)}
.lede{margin-top:22px;font-size:clamp(14px,1.6vw,17px);line-height:1.72;color:rgba(234,239,245,.55)}
.ctas{margin-top:38px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.primary{display:inline-block;border:1px solid rgba(200,164,94,.3);padding:14px 32px;font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(200,164,94,.8);transition:all .22s}
.primary:hover{border-color:var(--gold);color:var(--gold)}
.secondary{display:inline-block;padding:14px 0;font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(234,239,245,.35);transition:color .2s}
.secondary:hover{color:rgba(234,239,245,.7)}
</style>
</head>
<body>

<nav>
  <a class="lnk" href="index.html">&larr; Home</a>
  <a class="wm" href="index.html">PHA<span class="o">Ö</span>RA</a>
  <a class="lnk" href="contact.html">Contact</a>
</nav>

<div class="stage">
  <img class="stage-img" src="assets/misc/unfinished-wall.jpg" alt="" aria-hidden="true">
  <div class="stage-veil"></div>
  <div class="stage-body">
    <p class="eyebrow">This one isn't built yet</p>
    <h1>404</h1>
    <p class="lede">The page you're looking for doesn't exist, or hasn't been built. Everything we have finished lives at the links below.</p>
    <div class="ctas">
      <a class="primary" href="index.html">Back to the homepage &rarr;</a>
      <a class="secondary" href="portfolio/">See the work &rarr;</a>
    </div>
  </div>
</div>

</body>
</html>
