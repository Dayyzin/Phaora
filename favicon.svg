<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="atm" cx="50%" cy="60%" r="48%">
      <stop offset="0%"  stop-color="#0d6678" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#041a26" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020812" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#020812"/>

  <!-- Teal atmospheric glow -->
  <ellipse cx="50" cy="60" rx="42" ry="38" fill="url(#atm)"/>

  <!-- Mark: ring + umlaut dots -->
  <g filter="url(#glow)">
    <circle cx="41" cy="30" r="4"   fill="#d8eaf2"/>
    <circle cx="59" cy="30" r="4"   fill="#d8eaf2"/>
    <circle cx="50" cy="58" r="21"  fill="none" stroke="#d8eaf2" stroke-width="5.5"/>
  </g>
</svg>
