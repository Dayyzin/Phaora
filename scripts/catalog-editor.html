<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Catalog editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111; color: #eee; padding: 1.5rem; padding-bottom: 4rem;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;
    border-bottom: 1px solid #333; padding-bottom: 0.75rem;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header .sub { color: #999; font-size: 0.85rem; }
  header .count { font-family: monospace; font-size: 0.9rem; color: #c9a34a; }
  header .count.done { color: #6cbf6c; }

  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr); gap: 1.5rem; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .hero-wrap { position: relative; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; }
  .hero-wrap img { width: 100%; display: block; max-height: 60vh; object-fit: contain; }
  .plates { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .plate { position: relative; }
  .plates img {
    height: 160px; border-radius: 6px; border: 1px solid #333; cursor: pointer; object-fit: cover; display: block;
  }
  .plates img:hover { border-color: #c9a34a; }
  .photo-x {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,0.7); border: 1px solid #555; color: #eee; font-size: 1rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .photo-x:hover { background: #a33; border-color: #a33; }
  .make-hero {
    position: absolute; bottom: 6px; left: 6px; right: 6px; font-size: 0.65rem; text-align: center;
    background: rgba(0,0,0,0.75); border: 1px solid #555; color: #c9a34a; border-radius: 4px;
    padding: 0.2rem 0.3rem; cursor: pointer; opacity: 0; transition: opacity 0.15s;
  }
  .plate:hover .make-hero { opacity: 1; }
  .add-photo {
    display: inline-block; margin-top: 0.75rem; padding: 0.5rem 0.9rem; border: 1px dashed #444;
    border-radius: 6px; color: #999; cursor: pointer; font-size: 0.85rem;
  }
  .add-photo:hover { border-color: #c9a34a; color: #c9a34a; }

  form { display: grid; gap: 0.9rem; align-content: start; }
  label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
  input, textarea {
    width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    color: #eee; padding: 0.55rem 0.65rem; font-size: 0.95rem; font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #c9a34a; }
  textarea { min-height: 5rem; resize: vertical; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  fieldset { border: 1px solid #2a2a2a; border-radius: 8px; padding: 0.8rem; }
  legend { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0.4rem; }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; border-top: 1px solid #333;
    padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  button {
    background: #222; border: 1px solid #444; color: #eee; padding: 0.6rem 1.1rem;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem;
  }
  button:hover { border-color: #c9a34a; }
  button.primary { background: #c9a34a; border-color: #c9a34a; color: #1a1400; font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 0.8rem; color: #6cbf6c; min-width: 6rem; text-align: center; }
  .hint { font-size: 0.72rem; color: #666; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">Loading…</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="count" id="count"></div>
</header>

<main>
  <div>
    <div class="hero-wrap">
      <img id="hero" src="" alt="">
      <button type="button" class="photo-x" id="hero-delete" title="Delete this photo">&times;</button>
    </div>
    <div class="plates" id="plates"></div>
    <label class="add-photo" for="photo-upload">+ Add photo</label>
    <input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" style="display:none">
    <div class="hint" id="photo-status"></div>
  </div>

  <form id="form" autocomplete="off">
    <div>
      <label for="f_price_usd">Price (USD)</label>
      <input id="f_price_usd" type="number" step="1" data-field="price_usd">
    </div>
    <div>
      <label for="f_base_material">Base material</label>
      <input id="f_base_material" type="text" data-field="base_material">
    </div>
    <div>
      <label for="f_description">Description</label>
      <textarea id="f_description" data-field="description"></textarea>
    </div>

    <fieldset>
      <legend>Specs</legend>
      <div class="row3">
        <div>
          <label for="f_spec_h">Height (in)</label>
          <input id="f_spec_h" type="number" step="0.1" data-spec="total_height_inches">
        </div>
        <div>
          <label for="f_spec_w">Width (in)</label>
          <input id="f_spec_w" type="number" step="0.1" data-spec="total_width_inches">
        </div>
        <div>
          <label for="f_spec_d">Depth (in)</label>
          <input id="f_spec_d" type="number" step="0.1" data-spec="total_depth_inches">
        </div>
      </div>
      <div class="row2" style="margin-top:0.6rem">
        <div>
          <label for="f_spec_weight">Weight total (lbs)</label>
          <input id="f_spec_weight" type="number" step="0.1" data-spec="weight_lbs_total">
        </div>
        <div>
          <label for="f_spec_finish">Finish</label>
          <input id="f_spec_finish" type="text" data-spec="finish">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Other</legend>
      <div class="row3">
        <div>
          <label for="f_base_size">Base size (lbs)</label>
          <input id="f_base_size" type="number" step="0.1" data-field="base_size_lbs">
        </div>
        <div>
          <label for="f_wingspan">Wingspan (in)</label>
          <input id="f_wingspan" type="number" step="0.1" data-field="wingspan_inches">
        </div>
        <div>
          <label for="f_carve_hours">Carve hours</label>
          <input id="f_carve_hours" type="number" step="0.5" data-field="carve_hours">
        </div>
      </div>
    </fieldset>
  </form>
</main>

<div class="nav">
  <button id="prev" type="button">&larr; Prev</button>
  <span class="hint">Enter moves to the next field. Enter on the last field saves and advances.</span>
  <span class="status" id="status"></span>
  <button id="next" class="primary" type="button">Save &amp; Next &rarr;</button>
</div>

<script>
let pieces = [];
let idx = 0;

const ORDER = ['f_price_usd', 'f_base_material', 'f_description', 'f_spec_h', 'f_spec_w', 'f_spec_d', 'f_spec_weight', 'f_spec_finish', 'f_base_size', 'f_wingspan', 'f_carve_hours'];

function currentPiece() { return pieces[idx]; }

function renderCount() {
  const done = pieces.filter(p => p.complete).length;
  const el = document.getElementById('count');
  el.textContent = `${done} / ${pieces.length} complete`;
  el.className = 'count' + (done === pieces.length ? ' done' : '');
}

function renderPiece() {
  const p = currentPiece();
  document.getElementById('title').textContent = `${idx + 1} of ${pieces.length} — ${p.name}`;
  document.getElementById('sub').textContent = `${p.slug} · ${p.species}`;

  const hero = document.getElementById('hero');
  hero.src = p.photos[0] || '';
  hero.alt = p.name;
  document.getElementById('hero-delete').style.display = p.photos.length > 1 ? 'flex' : 'none';

  const platesEl = document.getElementById('plates');
  platesEl.innerHTML = '';
  p.photos.slice(1).forEach(src => {
    const filename = src.split('/').pop();
    const cell = document.createElement('div');
    cell.className = 'plate';

    const img = document.createElement('img');
    img.src = src;
    img.addEventListener('click', () => { hero.src = src; });
    cell.appendChild(img);

    const del = document.createElement('button');
    del.type = 'button'; del.className = 'photo-x'; del.title = 'Delete this photo'; del.textContent = '×';
    del.addEventListener('click', (e) => { e.stopPropagation(); deletePhotoAt(filename); });
    cell.appendChild(del);

    const hero_btn = document.createElement('button');
    hero_btn.type = 'button'; hero_btn.className = 'make-hero'; hero_btn.textContent = 'Make hero';
    hero_btn.addEventListener('click', (e) => { e.stopPropagation(); makeHero(filename); });
    cell.appendChild(hero_btn);

    platesEl.appendChild(cell);
  });

  setVal('f_price_usd', p.price_usd);
  setVal('f_base_material', p.base_material);
  setVal('f_description', p.description);
  setVal('f_spec_h', p.specs.total_height_inches);
  setVal('f_spec_w', p.specs.total_width_inches);
  setVal('f_spec_d', p.specs.total_depth_inches);
  setVal('f_spec_weight', p.specs.weight_lbs_total);
  setVal('f_spec_finish', p.specs.finish);
  setVal('f_base_size', p.base_size_lbs);
  setVal('f_wingspan', p.wingspan_inches);
  setVal('f_carve_hours', p.carve_hours);

  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').textContent = idx === pieces.length - 1 ? 'Save' : 'Save & Next →';

  document.getElementById(ORDER[0]).focus();
}

function setVal(id, v) {
  const el = document.getElementById(id);
  // A number field showing 0 reads as "already answered zero," not blank —
  // this is the one place display differs from what's stored, so a genuinely
  // unfilled field still looks unfilled when you land on it.
  if (el.type === 'number') {
    el.value = v === 0 || v == null ? '' : v;
  } else {
    el.value = v ?? '';
  }
}

function readForm() {
  const val = (id) => document.getElementById(id).value;
  return {
    price_usd: val('f_price_usd'),
    base_material: val('f_base_material'),
    description: val('f_description'),
    base_size_lbs: val('f_base_size'),
    wingspan_inches: val('f_wingspan'),
    carve_hours: val('f_carve_hours'),
    specs: {
      total_height_inches: val('f_spec_h'),
      total_width_inches: val('f_spec_w'),
      total_depth_inches: val('f_spec_d'),
      weight_lbs_total: val('f_spec_weight'),
      finish: val('f_spec_finish'),
    },
  };
}

async function save() {
  const p = currentPiece();
  const body = readForm();
  const status = document.getElementById('status');
  status.textContent = 'Saving…';
  const res = await fetch(`/api/piece/${encodeURIComponent(p.slug)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) { status.textContent = 'Error: ' + data.error; status.style.color = '#e06c6c'; return; }
  p.complete = data.complete;
  Object.assign(p, body, { specs: { ...p.specs, ...body.specs } });
  status.style.color = '#6cbf6c';
  status.textContent = 'Saved';
  renderCount();
  setTimeout(() => { if (status.textContent === 'Saved') status.textContent = ''; }, 1500);
}

async function goTo(newIdx) {
  await save();
  idx = Math.max(0, Math.min(pieces.length - 1, newIdx));
  renderPiece();
}

async function photoAction(action, body) {
  const p = currentPiece();
  const statusEl = document.getElementById('photo-status');
  statusEl.style.color = '#999';
  statusEl.textContent = 'Working…';
  const res = await fetch(`/api/piece/${encodeURIComponent(p.slug)}/photo/${action}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!data.ok) { statusEl.style.color = '#e06c6c'; statusEl.textContent = data.error; return; }
  p.photos = data.photos;
  statusEl.textContent = '';
  renderPiece();
}

function deletePhotoAt(filename) {
  if (!confirm(`Delete ${filename}? This removes the file from disk.`)) return;
  photoAction('delete', { filename });
}

function makeHero(filename) {
  photoAction('hero', { filename });
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('hero-delete').addEventListener('click', () => {
  const filename = currentPiece().photos[0]?.split('/').pop();
  if (filename) deletePhotoAt(filename);
});

document.getElementById('photo-upload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const dataBase64 = await readFileAsBase64(file);
  await photoAction('upload', { originalName: file.name, dataBase64 });
});

document.getElementById('prev').addEventListener('click', () => goTo(idx - 1));
document.getElementById('next').addEventListener('click', () => goTo(idx + 1));

document.getElementById('form').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const tag = e.target.tagName.toLowerCase();
  if (tag === 'textarea' && !e.metaKey && !e.ctrlKey) return; // plain Enter stays a newline in the description
  e.preventDefault();
  const pos = ORDER.indexOf(e.target.id);
  if (pos === -1) return;
  if (pos === ORDER.length - 1) {
    goTo(idx + 1);
  } else {
    document.getElementById(ORDER[pos + 1]).focus();
  }
});

fetch('/api/pieces').then(r => r.json()).then(data => {
  pieces = data;
  renderCount();
  renderPiece();
});
</script>

</body>
</html>
