<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>Sertanejo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sertanejo">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0e;--panel:#121218;--elev:#1a1a22;--line:#26262f;--text:#f3f3f6;--muted:#8a8a99;--accent:#d4a94a;--accent2:#f0c96f}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo{width:31px;height:31px;border-radius:9px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent2),#8a5f1d);color:#150f02;font-weight:800;font-size:14px}
.brand b{font-size:14px;letter-spacing:-.2px}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);font-size:13.5px;text-align:left;transition:.14s}
.nav button:hover{background:var(--elev);color:var(--text)}
.nav button.on{background:rgba(212,169,74,.13);color:var(--accent2);font-weight:600}
.nav svg{flex:none;opacity:.85}
.nav .ct{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side h4{margin:18px 10px 7px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#5d5d6c}
.srcs{display:flex;flex-direction:column;gap:1px}
.srcs button{padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs button:hover{background:var(--elev);color:var(--text)}
.srcs button.on{color:var(--accent2);background:rgba(212,169,74,.1)}
.side footer{margin-top:auto;padding:16px 10px 4px;font-size:10.5px;color:#54545f;line-height:1.6}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4fbf7a;margin-right:6px;vertical-align:1px;animation:p 2.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);flex:none}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;padding:9px 12px 9px 33px;border-radius:9px;border:1px solid var(--line);background:var(--elev);color:var(--text);font-size:13.5px;outline:none}
.search input:focus{border-color:var(--accent);background:#1c1c24}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.badge{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.hero{flex:none;display:flex;gap:20px;padding:22px 20px;border-bottom:1px solid var(--line);background:radial-gradient(120% 160% at 0% 0%,#17171f,#0b0b0e 62%)}
.cover{width:150px;height:150px;border-radius:13px;flex:none;position:relative;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.55);display:grid;place-items:center}
.cover .ini{font-size:38px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:-2px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.cover .ring{position:absolute;inset:0;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
body.playing .cover{animation:br 5s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.kicker{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
#nt{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.22;margin:0 0 5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#na{font-size:13px;color:var(--muted);margin-bottom:auto}
#na span{color:#5b5b69}
.viz{width:100%;height:42px;display:block;margin:12px 0 0;opacity:.9}
.transport{display:flex;align-items:center;gap:13px;margin-top:10px}
.tbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.14s;position:relative}
.tbtn:hover{color:var(--text);background:var(--elev)}
.tbtn.on{color:var(--accent2)}
.tbtn.on::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--accent2)}
.big{width:50px;height:50px;border-radius:50%;background:var(--text);color:#0b0b0e;display:grid;place-items:center;transition:.14s}
.big:hover{background:var(--accent2);transform:scale(1.05)}
.big:active{transform:scale(.95)}
.seekrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:36px;flex:none}
.time.r{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;margin:0;cursor:pointer;flex:1;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent2);margin-top:-4px;box-shadow:0 0 0 3px rgba(212,169,74,.16)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent2)}
#seek::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
#seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.volrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.volrow svg{opacity:.5;flex:none}
#vol{max-width:110px;flex:none;width:110px}
.listwrap{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px}
.lhead{display:flex;align-items:center;gap:10px;padding:14px 20px 8px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#5d5d6c}
.lhead .sp{flex:1}
.row{display:flex;align-items:center;gap:11px;padding:8px 20px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.035);transition:background .12s}
.row:hover{background:var(--panel)}
.row.on{background:rgba(212,169,74,.09)}
.row.on .t{color:var(--accent2);font-weight:600}
.num{width:20px;flex:none;font-size:11.5px;color:#5d5d6c;text-align:right;font-variant-numeric:tabular-nums}
.row.on .num{color:var(--accent)}
.mini{width:34px;height:34px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:rgba(255,255,255,.9)}
.mid{flex:1;min-width:0}
.t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:none;gap:2px;align-items:flex-end;height:13px;flex:none;width:14px}
.row.on .eq{display:flex}
.eq i{width:2px;background:var(--accent);animation:bar .85s ease-in-out infinite}
.eq i:nth-child(1){height:5px}
.eq i:nth-child(2){height:11px;animation-delay:.22s}
.eq i:nth-child(3){height:7px;animation-delay:.44s}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
body:not(.playing) .eq i{animation-play-state:paused}
.fav{width:26px;height:26px;flex:none;display:grid;place-items:center;color:#494955;border-radius:50%}
.fav:hover,.fav.on{color:var(--accent)}
.fav[data-del]{font-size:11px;opacity:.55}
.app{padding-top:env(safe-area-inset-top)}
.empty{padding:52px 20px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:760px){
 .app{grid-template-columns:1fr}
 .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:9px;gap:6px;align-items:center}
 .brand{padding:0 8px 0 2px}.brand small{display:none}
 .nav{flex-direction:row}.nav .ct{display:none}.nav button{white-space:nowrap;padding:7px 11px}
 .side h4,.srcs,.side footer{display:none}
 .hero{padding:16px;gap:14px}.cover{width:104px;height:104px}.cover .ini{font-size:28px}
 #nt{font-size:18px}.viz{height:32px}
 .row{padding:8px 16px}.top{padding:10px 16px}#badge{display:none}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="logo">S</div><div><b>Sertanejo</b><small>Offline</small></div></div>
  <nav class="nav" id="nav">
   <button data-mode="all" class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Biblioteca<span class="ct" id="c-all"></span></button>
   <button data-mode="artists"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>Artistas</button>
   <button data-mode="fav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-9.3A4 4 0 0112 8a4 4 0 017 2.7C19 15.6 12 20 12 20z"/></svg>Favoritas<span class="ct" id="c-fav"></span></button>
   <button data-mode="recent"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Recentes</button>
  </nav>
  <h4>Coletâneas</h4>
  <div class="srcs" id="srcs"></div>
  <footer><span class="dot"></span>100% offline<br>Nada sai do aparelho</footer>
 </aside>
 <main>
  <div class="top">
   <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Buscar faixa ou artista" autocomplete="off" spellcheck="false">
   </div>
   <button class="badge" data-act="import" id="add" style="color:var(--accent2);border-color:rgba(212,169,74,.4);display:inline-block">＋ Músicas</button>
   <span class="badge" id="badge"></span>
  </div>
  <section class="hero">
   <div class="cover" id="cover"><span class="ini" id="ini">S</span><span class="ring"></span></div>
   <div class="meta">
    <div class="kicker" id="kicker">Tocando agora</div>
    <h1 id="nt">Nada tocando</h1>
    <div id="na">Escolha uma faixa <span>·</span> aleatório desligado</div>
    <canvas class="viz" id="viz" width="600" height="84"></canvas>
    <div class="transport">
     <button class="tbtn" id="shuf" title="Aleatório (S)" aria-label="Aleatório"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
     <button class="tbtn" id="prev" title="Anterior (←)" aria-label="Anterior"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
     <button class="big" id="play" title="Tocar (Espaço)" aria-label="Tocar">
      <svg id="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
     </button>
     <button class="tbtn" id="next" title="Próxima (→)" aria-label="Próxima"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
     <button class="tbtn" id="rep" title="Repetir (R)" aria-label="Repetir"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
    </div>
    <div class="seekrow">
     <span class="time" id="cur">0:00</span>
     <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Progresso">
     <span class="time r" id="dur">0:00</span>
    </div>
    <div class="volrow">
     <button id="mute" aria-label="Mudo" style="display:grid;place-items:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button>
     <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
   </div>
  </section>
  <div class="listwrap"><div id="list"></div></div>
 </main>
</div>
<audio id="au" preload="metadata"></audio>
<script src="app.js?v=1"></script>
</body>
</html>
